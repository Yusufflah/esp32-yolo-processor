name: YOLO Image Processor

on:
  schedule:
    # Run every 2 minutes to check for new images
    - cron: '*/2 * * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  process-images:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install supabase requests pillow ultralytics opencv-python numpy

    - name: Run YOLO Image Processor
      run: python yolo_processor.py
