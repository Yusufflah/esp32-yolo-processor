name: YOLO Image Processor

on:
  schedule:
    # Run every 2 minutes to check for new images
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  process-images:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pillow ultralytics opencv-python numpy

    - name: Debug environment variables
      run: |
        echo "SUPABASE_URL is set: ${{ secrets.SUPABASE_URL != '' }}"
        echo "SUPABASE_SERVICE_KEY is set: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}"

    - name: Run YOLO Image Processor
      run: python yolo_processor.py
