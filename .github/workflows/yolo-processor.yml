name: YOLO Image Processor

on:
  repository_dispatch:
    types: [trigger-yolo-processing]
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Image URL to process'
        required: true
      filename:
        description: 'Filename'
        required: true

jobs:
  process-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests pillow ultralytics

      - name: Run YOLO processing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IMAGE_URL: ${{ github.event.inputs.image_url }}
          FILENAME: ${{ github.event.inputs.filename }}
        run: python yolo_processor.py
