name: YOLO Image Processor

on:
  schedule:
    # Run every 2 minutes to check for new images
    - cron: '*/2 * * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  process-images:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install system dependencies for OpenCV
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-0 libsm6 libxrender1 libxext6

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install supabase requests Pillow ultralytics opencv-python-headless numpy

    - name: Download YOLO model
      run: |
        python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"

    - name: Run YOLO Image Processor
      run: python yolo_processor.py
